[project]
name = "artpush-cli"
dynamic = ["version"]
description = "Утилита artpush: агентский интерфейс системы ArtPush"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
artpush = "artpush_cli.main:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Версия одна — __version__ в artpush_cli/__init__.py; сборка образа подставляет туда тег.
[tool.hatch.version]
path = "artpush_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["artpush_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Сборка зеркала гоняет настоящие git и curl (36 из 43 с набора): отдельное задание CI test:mirror, локально — -m mirror
addopts = "-m 'not mirror'"
markers = ["mirror: сборка и выпуск публичного зеркала (scripts/*agent_mirror*)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
